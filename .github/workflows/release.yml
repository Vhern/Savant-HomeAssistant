name: Release

# Push a tag like v0.4.1. The release is published with savant.zip already attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Tag must match manifest.json
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/savant/manifest.json'))['version'])")
          [ "$TAG" = "v$v" ] || { echo "tag $TAG does not match manifest version $v"; exit 1; }
      - run: make zip
      - name: Publish the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/savant.zip --clobber
          else
            git log -1 --format=%b | grep -v '^Co-Authored-By:' > notes.md
            gh release create "$TAG" dist/savant.zip --title "$TAG: $(git log -1 --format=%s)" --notes-file notes.md
          fi
